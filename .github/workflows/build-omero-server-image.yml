name: omero-server-extended image build and push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/scilifelabdatacentre/omero-server-extended
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: omero-server-extended
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          exit-code: 1
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: omero-server-extended/.trivyignore

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: Sign (keyless via OIDC)
        run: cosign sign --yes $IMAGE@${{ steps.build.outputs.digest }}
